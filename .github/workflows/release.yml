name: Release

# Pushing a v* tag builds every platform and publishes a GitHub Release.
# Running this by hand (workflow_dispatch) does everything except publish, so
# the whole pipeline can be exercised without inventing a tag.
#
# SBCL images cannot be cross-compiled, so there is one job per target and no
# way around it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SBCL_VERSION: '2.4.10'
  QUICKLISP_DIST: '2024-10-12'
  # Shipped next to cotd.exe on Windows, where there is no system SDL2.
  SDL2_VERSION: '2.32.10'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than the newest image on purpose: the binary
          # cannot run on a glibc older than the one it was built against.
          - os: ubuntu-22.04
            platform: linux-x86_64
            archive: tar.gz
          - os: windows-2022
            platform: windows-x86_64
            archive: zip
          # macos-13 is retired and macos-14 retires 2026-11-02; macos-15 is
          # Apple silicon. macos-15-intel is the last x86_64 macOS image if an
          # Intel build is ever wanted.
          - os: macos-15
            platform: macos-arm64
            archive: tar.gz
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-lisp
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          quicklisp-dist: ${{ env.QUICKLISP_DIST }}

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb

      # So that the game-window check below opens a real window here too.
      # Windows and macOS runners have a desktop session of their own; if one
      # turns out not to, the check says so and carries on with SDL's dummy
      # driver rather than failing.
      - name: Start a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          for _ in $(seq 1 30); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 1; done
          [ -S /tmp/.X11-unix/X99 ] || { echo "::error::Xvfb did not come up"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # Not "brew install sdl2": that is an alias for sdl2-compat, which is
      # SDL2's API reimplemented on top of SDL3, and it does not behave the
      # same - a synthetic SDL_TEXTINPUT event faults inside SDL_PushEvent
      # there. This is the real SDL2, as libsdl-org ships it for macOS: a
      # universal SDL2.framework, which is the first thing render.lisp's
      # library definition looks for on darwin.
      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 4 -o SDL2.dmg \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint /Volumes/SDL2 SDL2.dmg
          sudo cp -R /Volumes/SDL2/SDL2.framework /Library/Frameworks/
          hdiutil detach -quiet /Volumes/SDL2
          rm SDL2.dmg
          ls /Library/Frameworks/SDL2.framework

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The same runtime zip COMPILING.txt points at. It is needed twice:
          # to run the oracles here, and to ship inside the release archive.
          curl -fsSL --retry 5 --retry-delay 4 -o sdl2.zip \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}-win32-x64.zip"
          mkdir -p sdl2-runtime
          unzip -o -j sdl2.zip -d sdl2-runtime
          rm sdl2.zip
          ls sdl2-runtime
          # on PATH for this job, so a LOAD-FOREIGN-LIBRARY here finds it
          echo "$(pwd -W)/sdl2-runtime" >> "$GITHUB_PATH"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # grep -m1 and shell trimming rather than a grep | head | sed
          # pipeline: under `pipefail` a reader that stops early kills the
          # writer with SIGPIPE and fails the whole step. That is what broke
          # the v2.1.1 tag - see the CHANGELOG reader below, which lost the
          # same race on macOS while Linux and Windows won it.
          version="$(grep -m1 -oE ':version "[^"]+"' src/cotd.asd)"
          version="${version#:version \"}"
          version="${version%\"}"
          [ -n "$version" ] || { echo "::error::no :version in src/cotd.asd"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version from src/cotd.asd: $version"
          # A tag that does not match the version in the system definition is
          # a release tagged without bumping cotd.asd - stop before building.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match :version $version in src/cotd.asd"
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME agrees with cotd.asd"
            # The release body is the newest released CHANGELOG entry, so a tag
            # made without one would publish the previous version's notes.
            # Caught here rather than in the publish job, which runs after
            # everything has been built. The "Unreleased" section at the top of
            # the file collects changes that have no version yet and is skipped
            # by the same rule the publish job uses - cutting a release means
            # giving that section its date and version.
            # AWK reads the file itself and drops the CR per line. Piping
            # `tr -d '\r'` into it, as this used to, races: AWK reaches its
            # EXIT four lines in and closes the pipe, TR dies of SIGPIPE on
            # its next write, and `pipefail` turns that into a failed step.
            # Whether TR gets the whole 35KB file out first is luck - Linux
            # and Windows managed it, macOS did not, and the v2.1.1 build
            # failed here with everything about the tag correct.
            newest="$(awk '
              { sub(/\r$/, "") }
              /^-+$/ { hdr = 1; next }
              hdr    { hdr = 0
                       if ($0 ~ /^Unreleased[[:space:]]*$/) next
                       print; exit }' CHANGELOG.txt)"
            case "$newest" in
              *"v$version"*) echo "CHANGELOG's newest entry is \"$newest\"" ;;
              *) echo "::error::CHANGELOG.txt's newest entry is \"$newest\", which is not v$version"
                 exit 1 ;;
            esac
          fi

      # Which SDL this platform actually has. Homebrew's sdl2 is sdl2-compat,
      # SDL2's API on top of SDL3, which does not behave identically - it is
      # why a synthetic SDL_TEXTINPUT event faults on macOS and not elsewhere.
      - name: Report the SDL build
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd src
          sbcl --non-interactive \
            --eval '(declaim (sb-ext:muffle-conditions sb-ext:compiler-note))' \
            --eval '(asdf:load-system :cotd)' \
            --eval '(in-package :cotd)' \
            --eval '(cotd-render:with-init ()
                      (multiple-value-bind (version revision) (cotd-render:sdl-version)
                        (format t "~&SDL ~A, revision ~A~%" version revision)))'
        env:
          SDL_VIDEODRIVER: dummy

      - name: Headless oracles
        shell: bash
        run: |
          set -euo pipefail
          # These run SDL on its dummy video driver, so they are the only check
          # that exercises render.lisp on this platform at all.
          cd src
          sbcl --non-interactive \
            --eval '(declaim (sb-ext:muffle-conditions sb-ext:compiler-note))' \
            --eval '(asdf:load-system :cotd)' \
            --eval '(in-package :cotd)' \
            --eval '(let ((failed ()))
                      (unless (run-headless-startup-check) (push "startup check" failed))
                      (unless (run-headless-event-check) (push "event check" failed))
                      (let* ((entries (run-headless-regression))
                             (expected (* (length *headless-test-seeds*)
                                          (length *headless-test-faction-types*))))
                        (with-open-file (s "../level-checksums.txt" :direction :output
                                           :if-exists :supersede)
                          (dolist (e entries) (format s "~S~%" e)))
                        (unless (= (length entries) expected)
                          (push "level-gen regression" failed)))
                      (when failed
                        (format t "~&FAILED: ~{~A~^, ~}~%" failed)
                        (sb-ext:exit :code 1))
                      (format t "~&all oracles passed~%"))'

      # Its own step, and run even when the oracles above failed: this is the
      # one check that says whether the game runs on this platform, and a
      # crash in an earlier oracle must not hide the answer.
      - name: Game window check
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cd src
          sbcl --non-interactive \
            --eval '(declaim (sb-ext:muffle-conditions sb-ext:compiler-note))' \
            --eval '(asdf:load-system :cotd)' \
            --eval '(in-package :cotd)' \
            --eval '(multiple-value-bind (ok info)
                        (run-game-window-check :screenshot-dir #p"../game-window-shots/")
                      (declare (ignore ok))
                      (format t "~&game window: ~S~%" info))'

      - name: Build the executable
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            # through cmd rather than letting bash run it, so that build.bat's
            # own %~dp0 and exit code behave as they do for a player
            cmd //c build.bat
          else
            ./build.sh
          fi

      - name: Stage and archive the release
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="cotd-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          # data/ and help/ have to sit next to the executable: a release build
          # resolves its asset directory from the executable's own path.
          cp -R src/data src/help "dist/$name/"
          cp README.md CHANGELOG.txt LICENSE "dist/$name/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp src/cotd.exe "dist/$name/"
            cp sdl2-runtime/SDL2.dll "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp src/cotd "dist/$name/"
            if [ "${RUNNER_OS}" = "macOS" ]; then
              # Bundled for the same reason SDL2.dll is on Windows: there is no
              # system SDL2 to count on, and the obvious "brew install sdl2"
              # installs sdl2-compat instead. cp -R, not -RL: a framework is
              # held together by symlinks.
              cp -R /Library/Frameworks/SDL2.framework "dist/$name/"
            fi
            (cd dist && tar -czf "$name.tar.gz" "$name")
            echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l dist

      # Unpacking the archive somewhere else and running --check from a third
      # directory is what proves the thing that matters: the archive carries
      # its data, and the executable finds it from wherever it was installed.
      # Otherwise the verification below would just find the framework this job
      # installed for the oracles, and the bundled copy would go untested -
      # which is the whole point of bundling it. Everything that needed the
      # system one has already run.
      - name: Take the system SDL2 away before verifying (macOS)
        if: runner.os == 'macOS'
        run: sudo rm -rf /Library/Frameworks/SDL2.framework

      - name: Verify the archive (Linux, macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          verify="${RUNNER_TEMP}/verify"
          rm -rf "$verify" && mkdir -p "$verify"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$verify"
          exe="$verify/${{ steps.package.outputs.name }}/cotd"
          cd "$HOME"
          reported="$("$exe" --version)"
          echo "$reported"
          case "$reported" in
            *"${{ steps.version.outputs.version }}"*) ;;
            *) echo "::error::the binary reports '$reported', not version ${{ steps.version.outputs.version }}"; exit 1 ;;
          esac
          "$exe" --check
          # and the unpacked binary actually runs: its own window, its own
          # menu, a key press that moves the selection, a clean quit
          "$exe" --selftest "$GITHUB_WORKSPACE/game-window-shots/exe"
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/cotd-data

      - name: Verify the archive (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path $env:RUNNER_TEMP 'verify'
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $verify | Out-Null
          7z x "${{ steps.package.outputs.archive }}" "-o$verify" | Out-Null
          $exe = Join-Path $verify '${{ steps.package.outputs.name }}\cotd.exe'
          # cotd.exe is a GUI-subsystem program: neither cmd nor PowerShell
          # waits for one, and it has no console to print to. -Wait -PassThru
          # gets a real exit code, and a redirected handle is inherited even
          # with no console attached.
          function Invoke-Cotd([string[]]$arguments, $outFile) {
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru `
                   -WorkingDirectory $env:USERPROFILE -RedirectStandardOutput $outFile
            Get-Content $outFile | Write-Host
            return $p.ExitCode
          }
          $code = Invoke-Cotd '--version' (Join-Path $env:RUNNER_TEMP 'version.txt')
          if ($code -ne 0) { throw "cotd.exe --version exited with $code" }
          $reported = Get-Content (Join-Path $env:RUNNER_TEMP 'version.txt') -Raw
          if ($reported -notlike '*${{ steps.version.outputs.version }}*') {
            throw "the binary reports '$reported', not version ${{ steps.version.outputs.version }}"
          }
          $code = Invoke-Cotd '--check' (Join-Path $env:RUNNER_TEMP 'check.txt')
          if ($code -ne 0) { throw "cotd.exe --check exited with $code (data files missing from the archive)" }
          # and the unpacked binary actually runs: its own window, its own
          # menu, a key press that moves the selection, a clean quit
          $shots = Join-Path $env:GITHUB_WORKSPACE 'game-window-shots\exe'
          $code = Invoke-Cotd @('--selftest', $shots) (Join-Path $env:RUNNER_TEMP 'selftest.txt')
          if ($code -ne 0) { throw "cotd.exe --selftest exited with $code" }
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/cotd-data

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

      # The menu screenshots are the thing to look at when a platform is in
      # doubt: they show what that machine actually drew.
      - name: Upload this platform's checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.platform }}
          path: |
            level-checksums.txt
            game-window-shots/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish the GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # for CHANGELOG.txt, which the notes are built from
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: cotd-*
          merge-multiple: true

      - name: Write the release notes
        run: |
          set -euo pipefail
          # The body is the newest released entry in CHANGELOG.txt - everything
          # from its header to the next separator - so that what a release says
          # it changed and what the changelog says cannot drift apart. The
          # "Unreleased" section the file opens with has no version yet, so it
          # is skipped; the build job's tag check skips it by the same rule.
          # The file is CRLF, so each line's CR is dropped before anything is
          # matched - a pattern anchored on $ would never match the separator
          # otherwise. AWK reads the file directly instead of being fed by
          # `tr -d '\r'`: the EXIT below would close that pipe early and kill
          # TR with SIGPIPE, which under `pipefail` fails the step. The same
          # race broke the build job on macOS when v2.1.1 was tagged.
          awk '
            { sub(/\r$/, "") }
            /^-+$/   { if (printing) exit; hdr = 1; next }
            hdr      { hdr = 0
                       if ($0 ~ /^Unreleased[[:space:]]*$/) next
                       printing = 1 }
            printing { print }' CHANGELOG.txt > entry.md
          [ -s entry.md ] || { echo "::error::found no entry in CHANGELOG.txt"; exit 1; }
          # The per-platform install notes are kept beside this workflow rather
          # than inline, where indentation rules would turn them into code.
          { cat entry.md; echo; cat .github/release-install-notes.md; } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "City of the Damned ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            artifacts/*
